name: CraftedPortals
version: '${project.version}'
main: io.github.philipz794.craftedportals.CraftedPortals
api-version: '1.21'
description: Portals made of any blocks in any shape, activated with a named item.
author: philipz794
commands:
  craftedportals:
    description: List portals / reload config / create a portal
    usage: /craftedportals <list|reload|create>
    permission: craftedportals.admin
    aliases: [cp]
permissions:
  craftedportals.admin:
    description: Access to /craftedportals
    default: op
