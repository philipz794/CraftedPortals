name: Clock-Portals
version: '${project.version}'
main: de.philipz.clockportals.ClockPortals
api-version: '1.21'
description: Portals made of any blocks, activated with a named clock.
author: philipz794
commands:
  clockportals:
    description: List portals / reload config / create a portal
    usage: /clockportals <list|reload|create>
    permission: clockportals.admin
permissions:
  clockportals.admin:
    description: Access to /clockportals
    default: op
