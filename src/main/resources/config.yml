# ============================================================
#  CraftedPortals - Configuration
# ============================================================
#
# Building a portal:
#   - Vertical frame made of any solid blocks (full blocks, also soul
#     sand, mud, end portal frames; no slabs/stairs), in any closed shape:
#     rectangle, L, cross, heart ... Blocks that touch the interior
#     only diagonally (corners) may be left out.
#   - The frame must contain at least 'key-block-count' blocks
#     of type 'key-block'.
#   - Interior empty (air), at least two blocks of air stacked
#     vertically somewhere so that a player fits through.
#   - Right-click the frame with the activation item (a clock by
#     default) renamed on an anvil.
#   - Portals with the same clock name form a network and are
#     visited in a loop (1 -> 2 -> 3 -> 1 ...).

# Item that activates a portal when renamed on an anvil and right-clicked
# on the frame. Any item name from the Minecraft registry, e.g. CLOCK,
# COMPASS, RECOVERY_COMPASS, AMETHYST_SHARD, NETHER_STAR.
# Unknown names fall back to CLOCK and admins are warned.
# Tip: a hex colour at the end of the item name gives that network its own
# colour for the PARTICLE effect (sheet and DUST particles), overriding the
# colours below. For example, an item named 'HomePortal #ff00ff' creates a
# magenta network called 'HomePortal'. Works with or without the space.
activation-item: CLOCK

# Block that must be part of the frame
key-block: EMERALD_BLOCK
# Minimum number of these blocks in the frame
key-block-count: 2

# Maximum number of air blocks inside a portal (hard limit: 1000).
# 200 is roughly a 14x14 interior. Width and height are additionally
# capped at 64 blocks each.
max-blocks: 200

# Portal visuals: NETHER (purple nether portal blocks), END (end gateway
# blocks) or PARTICLE (the interior stays air and is filled with particles).
# Switch at any time with /craftedportals reload.
effect: PARTICLE

# ---------------------------------------------------------------------------
# Particle types (123 of the 128 in Minecraft 26.3 work, for 'type' here and
# in travel-particles; the five block-texture particles are left out).
# Names in upper case.
#
# No extra options needed (106):
#   ANGRY_VILLAGER, ASH, BUBBLE, BUBBLE_COLUMN_UP, BUBBLE_POP,
#   CAMPFIRE_COSY_SMOKE, CAMPFIRE_SIGNAL_SMOKE, CHERRY_LEAVES, CLOUD,
#   COMPOSTER, COPPER_FIRE_FLAME, CRIMSON_SPORE, CRIT, CURRENT_DOWN,
#   DAMAGE_INDICATOR, DOLPHIN, DRIPPING_DRIPSTONE_LAVA,
#   DRIPPING_DRIPSTONE_WATER, DRIPPING_HONEY, DRIPPING_LAVA,
#   DRIPPING_OBSIDIAN_TEAR, DRIPPING_WATER, DUST_PLUME, EGG_CRACK,
#   ELDER_GUARDIAN, ELECTRIC_SPARK, ENCHANT, ENCHANTED_HIT, END_ROD,
#   EXPLOSION, EXPLOSION_EMITTER, FALLING_DRIPSTONE_LAVA,
#   FALLING_DRIPSTONE_WATER, FALLING_HONEY, FALLING_LAVA, FALLING_NECTAR,
#   FALLING_OBSIDIAN_TEAR, FALLING_SPORE_BLOSSOM, FALLING_WATER, FIREFLY,
#   FIREWORK, FISHING, FLAME, GLOW, GLOW_SQUID_INK, GUST,
#   GUST_EMITTER_LARGE, GUST_EMITTER_SMALL, HAPPY_VILLAGER, HEART, INFESTED,
#   ITEM_COBWEB, ITEM_SLIME, ITEM_SNOWBALL, LANDING_HONEY, LANDING_LAVA,
#   LANDING_OBSIDIAN_TEAR, LARGE_SMOKE, LAVA, MYCELIUM, NAUTILUS, NOTE,
#   NOXIOUS_GAS, NOXIOUS_GAS_CLOUD, OMINOUS_SPAWNING, ORANGE_POPLAR_LEAVES,
#   PALE_OAK_LEAVES, PAUSE_MOB_GROWTH, POOF, PORTAL, RAID_OMEN, RAIN,
#   RED_POPLAR_LEAVES, RESET_MOB_GROWTH, REVERSE_PORTAL, SCRAPE,
#   SCULK_CHARGE_POP, SCULK_SOUL, SMALL_FLAME, SMALL_GUST, SMOKE, SNEEZE,
#   SNOWFLAKE, SONIC_BOOM, SOUL, SOUL_FIRE_FLAME, SPIT, SPLASH,
#   SPORE_BLOSSOM_AIR, SQUID_INK, SULFUR_BUBBLES, SULFUR_CUBE_GOO,
#   SWEEP_ATTACK, TOTEM_OF_UNDYING, TRIAL_OMEN, TRIAL_SPAWNER_DETECTION,
#   TRIAL_SPAWNER_DETECTION_OMINOUS, UNDERWATER, VAULT_CONNECTION,
#   WARPED_SPORE, WAX_OFF, WAX_ON, WHITE_ASH, WHITE_SMOKE, WITCH,
#   YELLOW_POPLAR_LEAVES
#
# Colourable via 'color' (and the network colour from the item name):
#   DUST, DUST_COLOR_TRANSITION, ENTITY_EFFECT, FLASH, TINTED_LEAVES, TRAIL,
#   EFFECT, INSTANT_EFFECT
#   DUST_COLOR_TRANSITION fades from 'color' to 'color-to'. TRAIL flies to
#   the portal centre (or the waiting player) within 'value' seconds.
#   EFFECT / INSTANT_EFFECT use 'value' as power.
#
# Need an item via 'item' (e.g. item: EMERALD):
#   ITEM
#
# Use 'value' (default 1.0): DRAGON_BREATH power, SCULK_CHARGE roll,
#   SHRIEK delay in ticks, GEYSER* water blocks, VIBRATION travel seconds.
#   For DUST and DUST_COLOR_TRANSITION 'value' is the particle size.
# ---------------------------------------------------------------------------

# Settings for effect: PARTICLE
particles:
  # Particle type, see the list above. Good portal looks: PORTAL,
  # REVERSE_PORTAL, END_ROD, SOUL, SOUL_FIRE_FLAME, WITCH, ENCHANT,
  # ELECTRIC_SPARK, DUST (own colour), TRAIL (streaks into the centre)
  type: TRAIL
  # Hex colour for colourable types
  color: "#4682B4"
  # Second colour for DUST_COLOR_TRANSITION
  color-to: "#FFFFFF"
  # Item for ITEM, value for the types listed above
  item: EMERALD
  value: 1.0
  # Particles per interior block and interval (0-10)
  per-block: 1
  # Ticks between particle bursts (1-40); lower = denser, more traffic
  interval-ticks: 5
  # Play the quiet nether portal ambient sound every 5 seconds
  sound: true
  # Translucent coloured sheet filling the portal, built from display
  # entities. Java clients only; Bedrock players see just the particles.
  sheet:
    enabled: true
    # Hex colour; an item named e.g. 'HomePortal #ff00ff' overrides it for
    # that network (see activation-item above)
    color: "#4169E1"
    # Opacity in percent (5-100); below about 15 the sheet is hard to see
    opacity: 50

# How long a survival player has to stand in the portal (in ticks,
# 20 ticks = 1 second). Vanilla nether portal: 80. Creative: always instant.
# With the END effect teleportation is always instant.
player-delay-ticks: 60

# Screen effect a survival player sees while waiting inside a portal.
# Works the same with every portal look (effect: NETHER, END, PARTICLE).
#   NAUSEA   - screen wobble like a nether portal (default)
#   FROST    - icy screen border like powder snow, no damage
#   DARKNESS - pulsing darkness like the Warden's
#   NONE     - no screen effect at all
# Vanilla's purple portal overlay is never shown: the plugin hides the portal
# blocks the waiting player touches from that player only, so the client
# cannot draw it. Other players still see the full portal.
travel-effect: NAUSEA

# Particles around the waiting player, independent of the portal visuals
travel-particles:
  enabled: true
  # Same options as under particles (type, color, color-to, item, value);
  # see the particle list above
  type: ENCHANT
  color: "#9B30FF"
  color-to: "#FFFFFF"
  item: EMERALD
  value: 1.0
  # Particles per tick at full progress (1-30)
  amount: 10

# Play the swelling nether portal trigger sound when the wait starts
travel-sound: true

# Show a progress bar in the action bar while waiting
travel-bar: true

# Consume the named item when activating a portal? Never in creative mode.
consume-item: true

# Do animals, villagers and monsters travel through portals on their own?
teleport-mobs: true
# Can thrown items fly through portals?
teleport-items: true
# Do leashed animals travel along with the player?
leashed-follow: true

# May zombified piglins spawn from the nether portal blocks of a
# CraftedPortal (like a vanilla nether portal in the overworld)?
# Only affects CraftedPortals, regular nether portals are unchanged.
piglin-spawn: false

# Messages (& for color codes)
messages:
  activated: "&aPortal &f%name% &aactivated &7(#%pos% of %count%)"
  info: "&7Portal &f%name% &7- #%pos% of %count%"
  destroyed: "&cPortal &f%name% &chas been destroyed"
  no-name: "&eRename the %item% on an anvil first - its name becomes the portal name."
  invalid-frame: "&cNo valid portal frame found."
  too-small: "&cThe portal needs at least two blocks of air stacked vertically."
  too-big: "&cThe portal is too big (max. %max% blocks of air inside)."
  missing-keys: "&cThe frame is missing key blocks (%have%/%need% %block%)."
  no-target: "&eThis portal has no destination yet - build a second one named &f%name%&e."
  travel-bar: "&5%bar%"
  arrived: "&aArrived at &f%name% &7(#%pos% of %count%)"
