# ============================================================
#  CraftedPortals - Configuration
# ============================================================
#
# Building a portal:
#   - Vertical frame made of any full blocks, in any closed shape:
#     rectangle, L, cross, heart ... Blocks that touch the interior
#     only diagonally (corners) may be left out.
#   - The frame must contain at least 'key-block-count' blocks
#     of type 'key-block'.
#   - Interior empty (air), at least two blocks of air stacked
#     vertically somewhere so that a player fits through.
#   - Right-click the frame with the activation item (a clock by
#     default) renamed on an anvil.
#   - Portals with the same clock name form a network and are
#     visited in a loop (1 -> 2 -> 3 -> 1 ...).

# Item that activates a portal when renamed on an anvil and right-clicked
# on the frame. Any item name from the Minecraft registry, e.g. CLOCK,
# COMPASS, RECOVERY_COMPASS, AMETHYST_SHARD, NETHER_STAR.
# Unknown names fall back to CLOCK and admins are warned.
# Tip: a hex colour at the end of the item name, e.g. "Home #3366FF", gives
# that network its own colour for the PARTICLE effect (sheet and DUST
# particles). The portal is still called "Home".
activation-item: CLOCK

# Block that must be part of the frame
key-block: EMERALD_BLOCK
# Minimum number of these blocks in the frame
key-block-count: 2

# Maximum number of air blocks inside a portal (hard limit: 1000).
# 200 is roughly a 14x14 interior. Width and height are additionally
# capped at 64 blocks each.
max-blocks: 200

# Portal visuals: NETHER (purple nether portal blocks), END (end gateway
# blocks) or PARTICLE (the interior stays air and is filled with particles).
# Switch at any time with /craftedportals reload.
effect: NETHER

# Settings for effect: PARTICLE
particles:
  # Any particle name that needs no extra data, e.g. PORTAL, REVERSE_PORTAL,
  # END_ROD, SOUL, SOUL_FIRE_FLAME, WITCH, ENCHANT, ELECTRIC_SPARK, DUST.
  # Full list with descriptions: docs/particles.md in the repository.
  type: PORTAL
  # Only used by DUST (hex color)
  color: "#9B30FF"
  # Particles per interior block and interval (0-10)
  per-block: 2
  # Ticks between particle bursts (1-40); lower = denser, more traffic
  interval-ticks: 2
  # Play the quiet nether portal ambient sound every 5 seconds
  sound: true
  # Translucent coloured sheet filling the portal, built from display
  # entities. Java clients only; Bedrock players see just the particles.
  sheet:
    enabled: true
    # Hex colour; a colour suffix on the item name overrides it per network
    color: "#9B30FF"
    # Opacity in percent (5-100)
    opacity: 20

# How long a survival player has to stand in the portal (in ticks,
# 20 ticks = 1 second). Vanilla nether portal: 80. Creative: always instant.
# With the END effect teleportation is always instant.
player-delay-ticks: 80

# What a survival player sees while waiting inside a portal:
#   VANILLA  - the purple nether portal overlay with its wobble, exactly as
#              in vanilla (default). The game client draws it by itself as
#              soon as the player stands in nether portal blocks.
#   NAUSEA   - only the wobble, without the purple tint (nausea effect)
#   FROST    - icy screen border like powder snow, no damage
#   DARKNESS - pulsing darkness like the Warden's
#   NONE     - no screen effect at all
# With every value except VANILLA the plugin hides the portal blocks the
# waiting player touches from that player only, so the vanilla overlay
# cannot appear. Other players still see the full portal.
travel-effect: VANILLA

# Particles around the waiting player, independent of the portal visuals
travel-particles:
  enabled: true
  # Same names as particles.type (see docs/particles.md)
  type: PORTAL
  # Only used by DUST (hex color)
  color: "#9B30FF"
  # Particles per tick at full progress (1-30)
  amount: 6

# Play the swelling nether portal trigger sound when the wait starts
travel-sound: true

# Show a progress bar in the action bar while waiting
travel-bar: true

# Consume the named item when activating a portal? Never in creative mode.
consume-item: true

# Do animals, villagers and monsters travel through portals on their own?
teleport-mobs: true
# Can thrown items fly through portals?
teleport-items: true
# Do leashed animals travel along with the player?
leashed-follow: true

# May zombified piglins spawn from the nether portal blocks of a
# CraftedPortal (like a vanilla nether portal in the overworld)?
# Only affects CraftedPortals, regular nether portals are unchanged.
piglin-spawn: false

# Messages (& for color codes)
messages:
  activated: "&aPortal &f%name% &aactivated &7(#%pos% of %count%)"
  info: "&7Portal &f%name% &7- #%pos% of %count%"
  destroyed: "&cPortal &f%name% &chas been destroyed"
  no-name: "&eRename the %item% on an anvil first - its name becomes the portal name."
  invalid-frame: "&cNo valid portal frame found."
  too-small: "&cThe portal needs at least two blocks of air stacked vertically."
  too-big: "&cThe portal is too big (max. %max% blocks of air inside)."
  missing-keys: "&cThe frame is missing key blocks (%have%/%need% %block%)."
  no-target: "&eThis portal has no destination yet - build a second one named &f%name%&e."
  travel-bar: "&5%bar%"
  arrived: "&aArrived at &f%name% &7(#%pos% of %count%)"
