# ============================================================
#  Clock-Portals - Konfiguration
# ============================================================
#
# Bau eines Portals:
#   - Senkrechter Rahmen (wie ein Netherportal) aus beliebigen
#     vollen Bloecken. Ecken duerfen fehlen.
#   - Im Rahmen muessen mindestens 'key-block-count' Bloecke vom
#     Typ 'key-block' verbaut sein.
#   - Innenraum leer (Luft), mindestens 1 breit und 2 hoch.
#   - Rechtsklick mit einer am Amboss benannten Uhr auf den Rahmen.
#   - Portale mit gleichem Uhr-Namen bilden ein Netzwerk und werden
#     der Reihe nach im Kreis durchlaufen (1 -> 2 -> 3 -> 1 ...).

# Block, der im Rahmen vorkommen muss
key-block: EMERALD_BLOCK
# Wie viele dieser Bloecke mindestens im Rahmen sein muessen
key-block-count: 2

# Maximale Aussenmasse des Rahmens (Breite und Hoehe in Bloecken)
max-size: 30

# Optik im Portal: NETHER (lila Netherportal) oder END (Endtransitportal)
effect: NETHER

# Wie lange ein Spieler im Survival im Portal stehen muss (in Ticks,
# 20 Ticks = 1 Sekunde). Vanilla-Netherportal: 80. Kreativ: immer sofort.
# Beim END-Effekt wird immer sofort teleportiert.
player-delay-ticks: 80

# Wird die benannte Uhr beim Aktivieren verbraucht?
consume-clock: true

# Laufen Tiere, Villager und Monster selbst durch Portale?
teleport-mobs: true
# Koennen geworfene Items durch Portale fliegen?
teleport-items: true
# Reisen angeleinte Tiere mit dem Spieler mit?
leashed-follow: true

# Meldungen (& fuer Farbcodes)
messages:
  activated: "&aPortal &f%name% &aaktiviert &7(Nr. %pos% von %count%)"
  info: "&7Portal &f%name% &7- Nr. %pos% von %count%"
  destroyed: "&cPortal &f%name% &cwurde zerstoert"
  no-name: "&eBenenne die Uhr zuerst am Amboss - der Name wird der Portalname."
  invalid-frame: "&cKein gueltiger Portalrahmen gefunden."
  too-big: "&cDer Rahmen ist zu gross (max. %max% Bloecke)."
  missing-keys: "&cIm Rahmen fehlen Schluesselbloecke (%have%/%need% %block%)."
  no-target: "&eDieses Portal hat noch kein Ziel - baue ein zweites mit dem Namen &f%name%&e."
